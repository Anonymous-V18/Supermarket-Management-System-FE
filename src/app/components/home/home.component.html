<div
  class="page-wrapper"
  [class.toggled]="layoutService.sidebarOpen()"
  [class.pinned]="layoutService.sidebarPinned()"
  [class.sidebar-hovered]="layoutService.sidebarHovered()"
>
  <!-- Main container start -->
  <div class="main-container">
    <app-sidebar></app-sidebar>

    <!-- Mobile backdrop: closes the sidebar drawer when tapped -->
    <div
      class="sidebar-backdrop"
      (click)="layoutService.closeSidebar()"
      aria-hidden="true"
    ></div>

    <!-- App container starts -->
    <div class="app-container">
      <app-header></app-header>

      <!-- App body starts -->
      <div class="app-body">
        <!-- Container starts -->
        <div class="container-fluid">
          <!-- Pages need the token from localStorage, so they are only
               rendered in the browser; SSR outputs the layout shell. -->
          @if (isBrowserReady()) {
          <router-outlet />
          }
        </div>
        <!-- Container ends -->
      </div>
      <!-- App body ends -->

      <app-footer></app-footer>
    </div>
    <!-- App container ends -->
  </div>
  <!-- Main container end -->
</div>
