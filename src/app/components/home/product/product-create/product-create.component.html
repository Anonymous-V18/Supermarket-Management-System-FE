<form [formGroup]="productCreateForm" (ngSubmit)="onSubmit()">
  <div class="card mb-3">
    <div class="card-header card-header-actions">
      <h1 class="card-title">Thêm sản phẩm</h1>
      <span class="form-required-note">
        Trường có dấu <span class="text-danger">*</span> là bắt buộc
      </span>
    </div>
    <div class="card-body">
      <section class="form-section">
        <h2 class="form-section-title">
          <i class="bi bi-info-circle"></i>Thông tin chung
        </h2>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label required" for="name">Tên sản phẩm</label>
            <input
              id="name"
              type="text"
              class="form-control"
              placeholder="VD: Sữa tươi Vinamilk 1L"
              formControlName="name"
            />
          </div>
          <div class="col-12">
            <label class="form-label required" for="description">Mô tả ngắn</label>
            <input
              id="description"
              type="text"
              class="form-control"
              placeholder="Mô tả ngắn gọn hiển thị trong danh sách"
              formControlName="description"
            />
          </div>
          <div class="col-12">
            <label class="form-label required" for="details">Thông tin bổ sung</label>
            <textarea
              id="details"
              rows="3"
              class="form-control"
              placeholder="Thành phần, hướng dẫn sử dụng, bảo quản..."
              formControlName="details"
            ></textarea>
          </div>
        </div>
      </section>

      <section class="form-section">
        <h2 class="form-section-title">
          <i class="bi bi-tags"></i>Phân loại
        </h2>
        <div class="row g-3">
          <div class="col-md-6 col-xl-3">
            <label class="form-label required" for="productCategoryId">Loại sản phẩm</label>
            <select
              id="productCategoryId"
              class="form-select"
              formControlName="productCategoryId"
            >
              <option value="" disabled>-- Chọn loại --</option>
              @for (productCategory of productCategoryDTOs; track
              productCategory) {
              <option value="{{ productCategory.id }}">
                {{ productCategory.name }}
              </option>
              }
            </select>
          </div>
          <div class="col-md-6 col-xl-3">
            <label class="form-label required" for="brandId">Hãng sản xuất</label>
            <select id="brandId" class="form-select" formControlName="brandId">
              <option value="" disabled>-- Chọn hãng --</option>
              @for (brand of brandDTOs; track brand) {
              <option value="{{ brand.id }}">{{ brand.name }}</option>
              }
            </select>
          </div>
          <div class="col-md-6 col-xl-3">
            <label class="form-label required" for="unitId">Đơn vị tính</label>
            <select id="unitId" class="form-select" formControlName="unitId">
              <option value="" disabled>-- Chọn đơn vị --</option>
              @for (unit of unitDTOs; track unit) {
              <option value="{{ unit.id }}">{{ unit.name }}</option>
              }
            </select>
          </div>
          <div class="col-md-6 col-xl-3">
            <label class="form-label required" for="supplierId">Nhà cung cấp chính</label>
            <select id="supplierId" class="form-select" formControlName="supplierId">
              <option value="" disabled>-- Chọn nhà cung cấp --</option>
              @for (supplier of supplierDTOs; track supplier) {
              <option value="{{ supplier.id }}">
                {{ supplier.name }}
              </option>
              }
            </select>
          </div>
        </div>
      </section>

      <section class="form-section">
        <h2 class="form-section-title">
          <i class="bi bi-shield-check"></i>Bảo hành và thuế
        </h2>
        <div class="row g-3">
          <div class="col-md-6 col-xl-3">
            <label class="form-label required" for="warranty">Thời gian bảo hành</label>
            <div class="input-group">
              <input
                id="warranty"
                type="number"
                min="0"
                class="form-control"
                formControlName="warranty"
              />
              <span class="input-group-text">tháng</span>
            </div>
          </div>
          <div class="col-md-6 col-xl-3">
            <label class="form-label required" for="vat">Thuế VAT</label>
            <div class="input-group">
              <input
                id="vat"
                type="number"
                min="0"
                class="form-control"
                formControlName="vat"
              />
              <span class="input-group-text">%</span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="card-footer">
    <div class="d-flex gap-2 justify-content-end form-group">
      <a [routerLink]="['/home/product']" class="btn btn-outline-secondary"
        >Hủy</a
      >
      <button
        type="submit"
        class="btn btn-success"
        [disabled]="productCreateForm.invalid"
      >
        Xác nhận và lưu
      </button>
    </div>
  </div>
</form>
