<form [formGroup]="warehouseCreateForm" (ngSubmit)="onSubmit()">
  <div class="card mb-3">
    <div class="card-header card-header-actions">
      <h1 class="card-title">Thêm kho</h1>
      <span class="form-required-note">
        Trường có dấu <span class="text-danger">*</span> là bắt buộc
      </span>
    </div>
    <div class="card-body">
      <section class="form-section">
        <h2 class="form-section-title">
          <i class="bi bi-info-circle"></i>Thông tin chung
        </h2>
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label required" for="name">Tên kho</label>
            <input
              id="name"
              type="text"
              class="form-control"
              formControlName="name"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label required" for="establishDate">Ngày thành lập</label>
            <input
              id="establishDate"
              type="date"
              class="form-control"
              formControlName="establishDate"
            />
          </div>
        </div>
      </section>

      <section class="form-section">
        <h2 class="form-section-title">
          <i class="bi bi-telephone"></i>Liên hệ
        </h2>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label required" for="phoneNumber">Số điện thoại</label>
            <input
              id="phoneNumber"
              type="tel"
              inputmode="tel"
              class="form-control"
              placeholder="VD: 0901234567"
              formControlName="phoneNumber"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label required" for="email">Email</label>
            <input
              id="email"
              type="email"
              class="form-control"
              placeholder="VD: kho1@sieuthi.vn"
              formControlName="email"
            />
          </div>
        </div>
      </section>

      <section class="form-section" formGroupName="newAddress">
        <h2 class="form-section-title">
          <i class="bi bi-geo-alt"></i>Địa chỉ
        </h2>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label required" for="cityId">Tỉnh / Thành phố</label>
            <select
              id="cityId"
              class="form-select"
              formControlName="cityId"
              (change)="getAllDistrictByCity()"
            >
              <option value="" disabled>-- Chọn tỉnh / thành phố --</option>
              @for (city of cityDTOs; track city) {
              <option value="{{ city.id }}">
                {{ city.name }}
              </option>
              }
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label required" for="districtId">Quận / Huyện</label>
            <select
              id="districtId"
              class="form-select"
              formControlName="districtId"
              (change)="getAllWardByDistrict()"
            >
              <option value="" disabled>-- Chọn quận / huyện --</option>
              @for (district of districtDTOs; track district) {
              <option value="{{ district.id }}">
                {{ district.name }}
              </option>
              }
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label required" for="wardId">Phường / Xã</label>
            <select id="wardId" class="form-select" formControlName="wardId">
              <option value="" disabled>-- Chọn phường / xã --</option>
              @for (ward of wardDTOs; track ward) {
              <option value="{{ ward.id }}">{{ ward.name }}</option>
              }
            </select>
          </div>
          <div class="col-12">
            <label class="form-label required" for="street">Số nhà, tên đường</label>
            <input
              id="street"
              type="text"
              class="form-control"
              placeholder="VD: 123 Nguyễn Văn Linh"
              formControlName="street"
            />
          </div>
        </div>
      </section>

      <section class="form-section">
        <h2 class="form-section-title">
          <i class="bi bi-card-text"></i>Ghi chú
        </h2>
        <label class="form-label required" for="moreInfo">Thông tin bổ sung</label>
        <textarea
          id="moreInfo"
          rows="3"
          class="form-control"
          formControlName="moreInfo"
        ></textarea>
      </section>
    </div>
  </div>

  <div class="card-footer">
    <div class="d-flex gap-2 justify-content-end form-group">
      <a [routerLink]="['/home/warehouse']" class="btn btn-outline-secondary"
        >Hủy</a
      >
      <button
        type="submit"
        class="btn btn-success"
        [disabled]="warehouseCreateForm.invalid"
      >
        Xác nhận và lưu
      </button>
    </div>
  </div>
</form>
