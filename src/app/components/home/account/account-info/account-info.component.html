<form [formGroup]="employeeUpdateForm" (ngSubmit)="onSubmit()">
  <div class="py-3">
    <p class="form-required-note mb-3">
      Trường có dấu <span class="text-danger">*</span> là bắt buộc
    </p>

    <section class="form-section">
      <h2 class="form-section-title">
        <i class="bi bi-person"></i>Thông tin cá nhân
      </h2>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label required" for="name">Họ tên</label>
          <input
            id="name"
            type="text"
            class="form-control"
            formControlName="name"
          />
        </div>
        <div class="col-md-3 col-6">
          <label class="form-label required" for="gender">Giới tính</label>
          <select id="gender" class="form-select" formControlName="gender">
            <option value="Nam">Nam</option>
            <option value="Nữ">Nữ</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
        <div class="col-md-3 col-6">
          <label class="form-label required" for="dob">Ngày sinh</label>
          <input
            id="dob"
            type="date"
            class="form-control"
            formControlName="dob"
          />
        </div>
      </div>
    </section>

    <section class="form-section">
      <h2 class="form-section-title">
        <i class="bi bi-telephone"></i>Liên hệ
      </h2>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label required" for="phoneNumber">Số điện thoại</label>
          <input
            id="phoneNumber"
            type="tel"
            inputmode="tel"
            class="form-control"
            formControlName="phoneNumber"
          />
        </div>
        <div class="col-md-6">
          <label class="form-label required" for="email">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
          />
        </div>
      </div>
    </section>

    <section class="form-section" formGroupName="currentAddress">
      <h2 class="form-section-title">
        <i class="bi bi-geo-alt"></i>Địa chỉ
      </h2>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label required" for="cityId">Tỉnh / Thành phố</label>
          <select
            id="cityId"
            class="form-select"
            formControlName="cityId"
            (change)="getAllDistrictByCity()"
          >
            @for (city of cityDTOs; track city) {
            <option value="{{ city.id }}">
              {{ city.name }}
            </option>
            }
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label required" for="districtId">Quận / Huyện</label>
          <select
            id="districtId"
            class="form-select"
            formControlName="districtId"
            (change)="getAllWardByDistrict()"
          >
            @for (district of districtDTOs; track district) {
            <option value="{{ district.id }}">
              {{ district.name }}
            </option>
            }
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label required" for="wardId">Phường / Xã</label>
          <select id="wardId" class="form-select" formControlName="wardId">
            @for (ward of wardDTOs; track ward) {
            <option value="{{ ward.id }}">
              {{ ward.name }}
            </option>
            }
          </select>
        </div>
        <div class="col-12">
          <label class="form-label required" for="street">Số nhà, tên đường</label>
          <input
            id="street"
            type="text"
            class="form-control"
            formControlName="street"
          />
        </div>
      </div>
    </section>

    <section class="form-section">
      <h2 class="form-section-title">
        <i class="bi bi-briefcase"></i>Công việc
      </h2>
      <p class="form-text mt-0 mb-3">
        Vị trí và quyền hạn do quản lý cấp, bạn không tự thay đổi được.
      </p>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="positionId">Vị trí làm việc</label>
          <select id="positionId" class="form-select" formControlName="positionId">
            @for (position of positionDTOs; track position) {
            <option value="{{ position.id }}">
              {{ position.name }}
            </option>
            }
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="roleIds">Quyền hạn</label>
          <ng-select
            labelForId="roleIds"
            [items]="roleDTOs"
            bindLabel="name"
            bindValue="id"
            formControlName="roleIds"
            multiple="true"
          >
          </ng-select>
        </div>
      </div>
    </section>
  </div>

  <div class="card-footer">
    <div class="d-flex gap-2 justify-content-end form-group">
      <a
        [routerLink]="['/home/account/account-info']"
        class="btn btn-outline-secondary"
        >Hủy</a
      >
      <button
        type="submit"
        class="btn btn-success"
        [disabled]="employeeUpdateForm.invalid"
      >
        Lưu thay đổi
      </button>
    </div>
  </div>
</form>
