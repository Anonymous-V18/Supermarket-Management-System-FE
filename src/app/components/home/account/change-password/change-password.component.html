<form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
  <div class="py-3">
    <div class="row">
      <div class="col-lg-6 col-md-8 col-12">
        <div class="mb-3">
          <label for="currentPassword" class="form-label required"
            >Mật khẩu hiện tại</label
          >
          <input
            id="currentPassword"
            type="password"
            class="form-control"
            autocomplete="current-password"
            formControlName="oldPassword"
          />
        </div>
        <div class="mb-3">
          <label for="newPassword" class="form-label required">Mật khẩu mới</label>
          <input
            id="newPassword"
            type="password"
            class="form-control"
            autocomplete="new-password"
            aria-describedby="newPasswordHint"
            formControlName="newPassword"
          />
          <div id="newPasswordHint" class="form-text">Tối thiểu 8 ký tự.</div>
        </div>
        <div class="mb-3">
          <label for="confirmNewPassword" class="form-label required"
            >Nhập lại mật khẩu mới</label
          >
          <input
            id="confirmNewPassword"
            type="password"
            class="form-control"
            autocomplete="new-password"
            formControlName="confirmPassword"
          />
          @if(this.changePasswordForm.value.newPassword !==
          this.changePasswordForm.value.confirmPassword &&
          this.changePasswordForm.get('confirmPassword')!.touched){
          <div class="text-danger small mt-1">
            <i class="bi bi-exclamation-triangle me-1"></i>Mật khẩu nhập lại
            không trùng khớp.
          </div>
          }
        </div>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <div class="d-flex gap-2 justify-content-end form-group">
      <button type="reset" class="btn btn-outline-secondary">Hủy</button>
      <button
        type="submit"
        class="btn btn-success"
        [disabled]="changePasswordForm.invalid"
      >
        Đổi mật khẩu
      </button>
    </div>
  </div>
</form>
