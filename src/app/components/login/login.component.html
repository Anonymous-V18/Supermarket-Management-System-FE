<div class="login-page container">
  <div class="row justify-content-center">
    <div class="col-xl-4 col-lg-5 col-md-7 col-sm-9 col-12">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="my-4 my-sm-5">
        <div class="login-card border rounded-3 bg-white p-4 p-sm-5">
          <div class="login-form">
            <div class="mb-4 d-flex align-items-center justify-content-center">
              <img
                src="assets/images/anonymous-logo-1.png"
                class="img-fluid login-logo"
                alt="Anonymous"
              />
            </div>
            <h5 class="fw-bold mb-4 text-center">
              Vui lòng đăng nhập để vào hệ thống.
            </h5>
            <div class="mb-3">
              <label class="form-label" for="username">Tên đăng nhập</label>
              <input
                id="username"
                type="text"
                class="form-control form-control-lg"
                placeholder="Nhập tên đăng nhập"
                autocomplete="username"
                formControlName="username"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Mật khẩu</label>
              <input
                id="password"
                type="password"
                class="form-control form-control-lg"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                formControlName="password"
              />
            </div>
            <div class="d-grid pt-2">
              <button
                type="submit"
                class="btn btn-lg btn-primary"
                [disabled]="!loginForm.valid"
              >
                ĐĂNG NHẬP
              </button>
            </div>
            <p class="text-center text-secondary small mt-4 mb-0">
              Quên mật khẩu? Vui lòng liên hệ quản lý cửa hàng để được cấp lại.
            </p>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
