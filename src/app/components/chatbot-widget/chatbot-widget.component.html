@if (!hidden()) {
  <div class="rag-widget-wrapper">
    @if (chat.widgetOpen()) {
      <section #panel id="rag-widget-panel" class="rag-widget-panel shadow-lg" role="dialog" aria-modal="false"
               aria-labelledby="rag-widget-title" (keydown)="trapFocus($event)">
        <header class="rag-widget-header">
          <div class="d-flex align-items-center gap-2 min-w-0">
            <div class="rag-widget-avatar" aria-hidden="true"><i class="bi bi-robot"></i></div>
            <div class="min-w-0">
              <h2 id="rag-widget-title" class="rag-widget-title">Trợ lý nội bộ</h2>
              <div class="rag-widget-subtitle">Trả lời theo tài liệu và quyền của bạn</div>
            </div>
          </div>
          <div class="d-flex align-items-center gap-1">
            <button type="button" class="rag-widget-icon-btn" (click)="chat.newConversation()" aria-label="Cuộc trò chuyện mới"
                    title="Cuộc trò chuyện mới">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
            <button type="button" class="rag-widget-icon-btn" (click)="openFullPage()" aria-label="Mở trang trợ lý đầy đủ"
                    title="Mở trang đầy đủ">
              <i class="bi bi-arrows-angle-expand" aria-hidden="true"></i>
            </button>
            <button type="button" class="rag-widget-icon-btn" (click)="close()" aria-label="Thu gọn trợ lý" title="Thu gọn">
              <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
          </div>
        </header>
        <app-chatbot-thread class="rag-widget-thread" [compact]="true" />
      </section>
    }

    <button #launcher type="button" class="rag-widget-fab shadow" (click)="toggle()"
            [attr.aria-expanded]="chat.widgetOpen()" aria-controls="rag-widget-panel"
            [attr.aria-label]="chat.widgetOpen() ? 'Thu gọn trợ lý nội bộ' : 'Mở trợ lý nội bộ'">
      <i class="bi fs-4" [class.bi-chevron-down]="chat.widgetOpen()" [class.bi-chat-dots-fill]="!chat.widgetOpen()"
         aria-hidden="true"></i>
    </button>
  </div>
}
