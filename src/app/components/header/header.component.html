<div class="app-header d-flex align-items-center">
  <!-- Toggle buttons start -->
  <div class="d-flex">
    <button
      type="button"
      class="btn btn-outline-primary me-2 toggle-sidebar"
      id="toggle-sidebar"
      aria-label="Mở menu"
      [attr.aria-expanded]="layoutService.sidebarOpen()"
      (click)="layoutService.toggleSidebar()"
    >
      <i
        class="bi fs-5"
        [class.bi-x-lg]="layoutService.sidebarOpen()"
        [class.bi-list]="!layoutService.sidebarOpen()"
      ></i>
    </button>
    <button
      type="button"
      class="btn btn-outline-primary me-2 pin-sidebar"
      id="pin-sidebar"
      [attr.aria-label]="
        layoutService.sidebarPinned() ? 'Mở rộng menu' : 'Thu gọn menu'
      "
      (click)="layoutService.togglePin()"
    >
      <i
        class="bi fs-5"
        [class.bi-text-indent-left]="layoutService.sidebarPinned()"
        [class.bi-text-indent-right]="!layoutService.sidebarPinned()"
      ></i>
    </button>
  </div>
  <!-- Toggle buttons end -->

  <!-- App brand sm start -->
  <div class="app-brand-sm d-md-none">
    <a [routerLink]="['/home/dashboard']">
      <img
        src="assets/images/anonymous-logo-2.png"
        class="rounded-2 img-3x"
        alt="Anonymous"
      />
    </a>
  </div>
  <!-- App brand sm end -->

  <!-- App header actions start -->
  <div class="header-actions">
    <div class="d-none d-sm-block text-end me-2 lh-sm">
      <div class="fw-semibold text-truncate header-user-name">
        {{ this.name }}
      </div>
      <small class="text-secondary">{{ this.username }}</small>
    </div>
    <div class="dropdown ms-2">
      <a
        id="userSettings"
        class="dropdown-toggle d-flex py-2 align-items-center text-decoration-none"
        role="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <img
          src="assets/images/user.png"
          class="rounded-2 img-3x"
          alt="Tài khoản"
        />
      </a>
      <div class="dropdown-menu dropdown-menu-end shadow-sm">
        <div class="p-3 border-bottom mb-2">
          <h6 class="mb-1">{{ this.name }}</h6>
          <p class="m-0 small opacity-50">{{ this.username }}</p>
        </div>
        <a
          class="dropdown-item d-flex align-items-center"
          [routerLink]="['/home/account']"
          ><i class="bi bi-person fs-4 me-2"></i>Hồ sơ</a
        >
        <a
          class="dropdown-item d-flex align-items-center"
          [routerLink]="['/home/account/change-password']"
          ><i class="bi bi-key fs-4 me-2"></i>Đổi mật khẩu</a
        >
        <div class="d-grid p-3 py-2">
          <button type="button" class="btn btn-danger" (click)="logout()">
            Đăng xuất
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- App header actions end -->
</div>
